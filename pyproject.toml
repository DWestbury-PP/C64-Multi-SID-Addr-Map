[project]
name = "hvsc-multisid"
version = "0.1.0"
description = "Scan HVSC (High Voltage SID Collection) for multi-SID tunes and extract SID chip addresses"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
    { name = "Darrell Westbury", email = "darrell.westbury@gmail.com" }
]
keywords = ["c64", "commodore", "sid", "hvsc", "chiptune", "retro"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.scripts]
hvsc-multisid = "hvsc_multisid:main"

[project.urls]
Homepage = "https://github.com/DWestbury-PP/C64-Multi-SID-Addr-Map"
Repository = "https://github.com/DWestbury-PP/C64-Multi-SID-Addr-Map"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
